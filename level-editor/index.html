<!DOCTYPE html>
<html lang="en">
<style>
    @import url('https://fonts.cdnfonts.com/css/trajan-pro');
</style>

<link href="https://fonts.cdnfonts.com/css/trajan-pro" rel="stylesheet">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBWG Editor</title>
    <link rel="stylesheet" href="css/palette.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/interface.css">
    <link rel="stylesheet" href="css/modal.css">
    <script defer type="module" src="js/main.js"></script>
</head> 
<body oncontextmenu="return false;">
    <div id="menu-bar">
        <div class="menu-group">
            <button class="img-button">H</button>
            <button class="menu-item">File</button>
            <button class="menu-item">Level</button>
            <button class="menu-item">Preferences</button>
        </div>
        <div class="menu-group">
            <p>Layer:</p>
            <button class="menu-item">Tile</button>
            <button class="menu-item">Object</button>
            <button class="menu-item">Text</button>

        </div>
    </div>
    <section id="horizontal">
        <div id="tool-bar">
            <button class="img-button">M</button>
            <button class="img-button">E</button>
            <button class="img-button">T</button>
            <button class="img-button" data-popout="level-points">
                <img src="assets/objects/spawn_fb.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-popout="diamonds">
                <img src="assets/objects/diamond_silver.svg" alt="" class="tool-img">
            </button>          
            <button class="img-button">
                <img src="assets/objects/box_normal.svg" alt="" class="tool-img">
            </button>
            <button class="img-button">
                <img src="assets/objects/button.svg" alt="" class="tool-img">
            </button>
            <button class="img-button">
                <img src="assets/objects/lever_left_0.svg" alt="" class="tool-img">
            </button>
            <button class="img-button">
                <img src="assets/objects/portal_left.svg" alt="" class="tool-img">
            </button>
            <button class="img-button">P</button>
            <button class="img-button">W</button>
            <button class="img-button">
                <img src="assets/objects/light_emitter.svg" alt="" class="tool-img">
            </button>
            <button class="img-button">t</button>
            <button class="img-button">b</button>
        </div>
        <div id="outer-canvas-container">
            <div id="canvas-container">
                <canvas id="tiles"></canvas>
                <canvas id="objects"></canvas>
                <canvas id="text"></canvas>
                <canvas id="highlight"></canvas>
            </div>
        </div>
    </section>
    <div id="popout-container">
        <div class="popout" data-anchor="level-points">
            <button class="img-button">
                <img src="assets/objects/spawn_fb.svg" alt="" class="tool-img">
            </button>
            <button class="img-button">
                <img src="assets/objects/spawn_wg.svg" alt="" class="tool-img">
            </button>
            <button class="img-button">
                <img src="assets/objects/door_fb.svg" alt="" class="tool-img">
            </button>
            <button class="img-button">
                <img src="assets/objects/door_wg.svg" alt="" class="tool-img">
            </button>
        </div>
        <div class="popout" data-anchor="diamonds">
            <button class="img-button">
                <img src="assets/objects/diamond_fb.svg" alt="" class="tool-img">
            </button>
            <button class="img-button">
                <img src="assets/objects/diamond_wg.svg" alt="" class="tool-img">
            </button>
            <button class="img-button">
                <img src="assets/objects/diamond_silver.svg" alt="" class="tool-img">
            </button>
            <button class="img-button">
                <img src="assets/objects/diamond_fbwg.svg" alt="" class="tool-img">
            </button>
        </div>
    </div>
</body>
</html>
