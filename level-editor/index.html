<!DOCTYPE html>
<html lang="en">
<style>
    @import url('https://fonts.cdnfonts.com/css/trajan-pro');
</style>

<link href="https://fonts.cdnfonts.com/css/trajan-pro" rel="stylesheet">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBWG Editor</title>
    <link rel="stylesheet" href="css/palette.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/interface.css">
    <link rel="stylesheet" href="css/modal.css">
    <script defer type="module" src="js/main.js"></script>
</head> 
<body oncontextmenu="return false;">
    <div id="menu-bar">
        <div class="menu-group">
            <button class="img-button">H</button>
            <button class="menu-item">File</button>
            <button class="menu-item">Level</button>
            <button class="menu-item">Preferences</button>
        </div>
        <div class="menu-group">
            <p>Layer:</p>
            <button class="menu-item">Tile</button>
            <button class="menu-item">Object</button>
            <button class="menu-item">Text</button>

        </div>
    </div>
    <section id="horizontal">
        <div id="tool-bar">
            <button class="img-button" data-tool="object:move">M</button>
            <button class="img-button" data-tool="object:edit">E</button>
            <button class="img-button" data-popout="tiles" data-tool="tile:ground">
                <img src="assets/tiles/tile_ground.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-popout="fluids" data-tool="tile:water">
                <img src="assets/tiles/fluid_water.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-popout="level-points" data-tool="object:spawn_fb">
                <img src="assets/objects/spawn_fb.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-popout="diamonds" data-tool="object:diamond_silver">
                <img src="assets/objects/diamond_silver.svg" alt="" class="tool-img">
            </button>          
            <button class="img-button" data-popout="boxes" data-tool="object:box_normal">
                <img src="assets/objects/box_normal.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-popout="buttons" data-tool="object:button">
                <img src="assets/objects/button.svg" alt="" class="tool-img">
            </button>
            <button class="img-button">
                <img src="assets/objects/lever_left_0.svg" alt="" class="tool-img">
            </button>
            <button class="img-button">
                <img src="assets/objects/portal_left.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="object:platform">P</button>
            <button class="img-button">W</button> <!-- Wind shit -->
            <button class="img-button">
                <img src="assets/objects/light_emitter.svg" alt="" class="tool-img">
            </button>
            <button class="img-button">t</button> <!-- Text item -->
            <button class="img-button">b</button> <!-- Text box -->
        </div>
        <div id="outer-canvas-container">
            <div id="canvas-container">
                <canvas id="tiles"></canvas>
                <canvas id="objects"></canvas>
                <canvas id="text"></canvas>
                <canvas id="highlight"></canvas>
            </div>
        </div>
    </section>
    <div id="popout-container">
        <div class="popout" data-anchor="tiles">
            <button class="img-button" data-tool="tile:air">
                <img src="assets/tiles/tile_air.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="tile:ground">
                <img src="assets/tiles/tile_ground.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="tile:slope_tr">
                <img src="assets/tiles/tile_slope_tr.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="tile:slope_tl">
                <img src="assets/tiles/tile_slope_tl.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="tile:slope_br">
                <img src="assets/tiles/tile_slope_br.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="tile:slope_bl">
                <img src="assets/tiles/tile_slope_bl.svg" alt="" class="tool-img">
            </button>
        </div>
        <div class="popout" data-anchor="fluids">
            <button class="img-button" data-tool="tile:water">
                <img src="assets/tiles/fluid_water.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="tile:lava">
                <img src="assets/tiles/fluid_lava.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="tile:acid">
                <img src="assets/tiles/fluid_acid.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="tile:ice">
                <img src="assets/tiles/fluid_ice.svg" alt="" class="tool-img">
            </button>
        </div>
        <div class="popout" data-anchor="level-points">
            <button class="img-button" data-tool="object:spawn_fb">
                <img src="assets/objects/spawn_fb.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="object:spawn_wg">
                <img src="assets/objects/spawn_wg.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="object:door_fb">
                <img src="assets/objects/door_fb.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="object:door_wg">
                <img src="assets/objects/door_wg.svg" alt="" class="tool-img">
            </button>
        </div>
        <div class="popout" data-anchor="diamonds">
            <button class="img-button" data-tool="object:diamond_fb">
                <img src="assets/objects/diamond_fb.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="object:diamond_wg">
                <img src="assets/objects/diamond_wg.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="object:diamond_silver">
                <img src="assets/objects/diamond_silver.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="object:diamond_fbwg">
                <img src="assets/objects/diamond_fbwg.svg" alt="" class="tool-img">
            </button>
        </div>
        <div class="popout" data-anchor="boxes">
            <button class="img-button" data-tool="object:box_normal">
                <img src="assets/objects/box_normal.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="object:box_heavy">
                <img src="assets/objects/box_heavy.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="object:box_mirror">
                <img src="assets/objects/box_mirror.svg" alt="" class="tool-img">
            </button>
        </div>
        <div class="popout" data-anchor="buttons">
            <button class="img-button" data-tool="object:button">
                <img src="assets/objects/button.svg" alt="" class="tool-img">
            </button>
            <button class="img-button" data-tool="object:timer_button">
                <img src="assets/objects/button.svg" alt="" class="tool-img">
            </button>
        </div>
    </div>
</body>
</html>
